services:
  app:
    image: oven/bun:slim
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DB_PORT=3001
      - NODE_ENV=production
    volumes:
      - ./dist:/app/dist:ro
      - ./dist-server:/app/dist-server:ro
      - ./server/drawing.json:/app/server/drawing.json
      - ./package.json:/app/package.json:ro
      - ./node_modules:/app/node_modules:ro
    working_dir: /app
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    command: "bun /app/dist-server/index.js"
    networks:
      - npm

networks:
  npm:
    external: true
    name: npm_network